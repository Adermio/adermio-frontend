  <title id="page-title">Votre Rapport Adermio</title>
  
  <style>
    /* Reset de base pour que l'iframe prenne bien tout l'écran */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Empêche le double scroll (parent + iframe) */
      background-color: #e5e7eb; /* Assorti au fond de ton rapport S3 */
      font-family: "Pretendard Variable","Pretendard Fallback",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    }

    /* Conteneur plein écran pour l'iframe */
    .iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Message d'erreur stylisé si le jobId est manquant */
    #error-state {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #f8fafc;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }

    .error-title {
      font-size: 20px;
      font-weight: 700;
      color: #0f3d39;
      margin-bottom: 10px;
    }

    .error-text {
      font-size: 15px;
      color: #64748b;
      margin-bottom: 25px;
    }

    .btn-home {
      background-color: #00897b;
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0, 137, 123, 0.3);
    }
  </style>
    <script src="/js/ttq.js"></script>

<body>

  <div class="iframe-container">
    <iframe id="reportFrame" title="Rapport Adermio"></iframe>
  </div>

  <div id="error-state">
    <div id="err-title" class="error-title">Lien invalide ou expiré</div>
    <div id="err-text" class="error-text">Nous n'avons pas pu trouver votre analyse.</div>
    <a id="err-btn" href="/formulaire" class="btn-home">Refaire une analyse</a>
  </div>

<script>
  // 1. LE CORRECTIF MAGIQUE : Détecter le retour navigateur (Bfcache)
  window.addEventListener("pageshow", (event) => {
    // event.persisted est "true" si la page est chargée depuis le cache (bouton retour Stripe)
    if (event.persisted) {
      console.log("[Adermio] Retour détecté, rechargement pour réactiver les boutons.");
      window.location.reload(); 
    }
  });

  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get("jobId");
    const lang = urlParams.get("lang") || "fr"; // FR par défaut si pas de paramètre
    
    const errorState = document.getElementById("error-state");
    const iframe = document.getElementById("reportFrame");

    // --- NOUVEAUTÉ : Traduction UX si lang=en ---
    // Allemand, néerlandais, grec ; toute autre langue non française retombe sur l'anglais (repli = anglais, jamais le français)
    const UX = {
      de: { title: "Ihr Adermio-Bericht", errTitle: "Ungültiger oder abgelaufener Link", errText: "Wir konnten Ihre Analyse nicht finden.", btn: "Analyse neu starten", href: "/de/form" },
      nl: { title: "Je Adermio-rapport", errTitle: "Deze link is ongeldig of verlopen", errText: "We konden je analyse niet vinden. Open de link uit je e-mail opnieuw of start een nieuwe analyse.", btn: "Start je gratis huidanalyse", href: "/nl/form" },
      el: { title: "Η αναφορά σας Adermio", errTitle: "Ο σύνδεσμος δεν είναι έγκυρος ή έχει λήξει", errText: "Δεν βρήκαμε την ανάλυσή σας. Ανοίξτε ξανά τον σύνδεσμο από το e-mail σας ή ξεκινήστε μια νέα ανάλυση.", btn: "Ξεκινήστε τη δωρεάν ανάλυση", href: "/el/form" },
      es: { title: "Su informe Adermio", errTitle: "Enlace no válido o caducado", errText: "No hemos encontrado su análisis.", btn: "Reiniciar el análisis", href: "/es/form" },
      pl: { title: "Twój raport Adermio", errTitle: "Link jest nieprawidłowy lub wygasł", errText: "Nie znaleźliśmy twojej analizy.", btn: "Rozpocznij analizę od nowa", href: "/pl/form" },
      pt: { title: "O seu relatório Adermio", errTitle: "Ligação inválida ou expirada", errText: "Não encontrámos a sua análise.", btn: "Recomeçar a análise", href: "/pt/form" },
      cs: { title: "Vaše zpráva Adermio", errTitle: "Odkaz je neplatný nebo vypršel", errText: "Vaši analýzu jsme nenašli.", btn: "Spustit analýzu znovu", href: "/cs/form" },
      it: { title: "Il suo report Adermio", errTitle: "Link non valido o scaduto", errText: "Non abbiamo trovato la sua analisi.", btn: "Ricominciare l’analisi", href: "/it/form" },
      en: { title: "Your Adermio Report", errTitle: "Invalid or expired link", errText: "We couldn't find your analysis.", btn: "Restart Analysis", href: "/en/form" },
    };
    if (lang !== "fr") {
      const t = UX[lang] || UX.en;
      document.documentElement.lang = UX[lang] ? lang : "en"; // Pour le SEO et l'accessibilité
      const pt = document.getElementById("page-title"); if (pt) pt.textContent = t.title; document.title = t.title; // la page a deux <title> : le navigateur affiche le premier
      document.getElementById("err-title").textContent = t.errTitle;
      document.getElementById("err-text").textContent = t.errText;
      document.getElementById("err-btn").textContent = t.btn;
      document.getElementById("err-btn").href = UX[lang] ? t.href : (["it", "es"].includes(lang) ? "https://adermio.com/" + lang + "/form" : t.href);
    }

    // Gestion de l'erreur si aucun jobId n'est présent
    if (!jobId) {
      errorState.style.display = "flex";
      return;
    }

    // Construction et injection de l'URL S3
    // TEST : deux rapports par analyse (A = ANALYSE_<jobId>.html, B = ANALYSE_<jobId>_B.html), sélecteur A | B en haut
    const version = (urlParams.get("v") || "a").toLowerCase() === "b" ? "b" : "a";
    const fileFor = v => `https://adermio-free.s3.eu-north-1.amazonaws.com/ANALYSE_${encodeURIComponent(jobId)}${v === "b" ? "_B" : ""}.html`;
    const reportUrl = fileFor(version);
    // Sélecteur A | B retiré (12/10) : on affiche A ; B reste accessible avec ?v=b
    
    // On expose l'origine autorisée globalement pour l'écouteur de message
    window.adermioAllowedOrigin = new URL(reportUrl).origin;
    
    iframe.src = reportUrl;
  });

  // 2. On place l'écouteur HORS du DOMContentLoaded pour qu'il soit toujours actif
  window.addEventListener("message", (event) => {
    // On s'assure que l'origine a bien été définie
    if (!window.adermioAllowedOrigin) return;

    // Validation stricte de l'origine
    if (event.origin !== window.adermioAllowedOrigin) return;

    // Validation du type de message
    if (!event.data || event.data.type !== "OPEN_STRIPE") return;

    const stripeUrl = String(event.data.url || "");

    // Validation stricte de l'URL cible
    const isValidStripeUrl = 
      stripeUrl.startsWith("https://checkout.stripe.com/") || 
      stripeUrl.startsWith("https://buy.stripe.com/");
    
    if (!isValidStripeUrl) return;

    // 3. Redirection (on utilise assign() qui gère un peu mieux l'historique navigateur que href)
    console.log("[Adermio] Ouverture de Stripe...");
    window.location.assign(stripeUrl);
  });
</script>

    <script src="/js/pwa.js" defer></script>

</body>
