<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Adermio · Suivi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEEEEE;
    --card: #FFFFFF;
    --ink: #251B13;
    --ink2: rgba(37, 27, 19, .62);
    --ink3: rgba(37, 27, 19, .40);
    --line: rgba(37, 27, 19, .08);
    --soft: rgba(37, 27, 19, .04);
    --ok: #3F8A5C;
    --warn: #C8892A;
    --bad: #C0473C;
    --warn-bg: #FBF3E6;
    --bad-bg: #FAECEA;
    --ok-bg: #EBF4EE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: "Inter", -apple-system, system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "cv11" 1;
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }

  /* En-tête */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 30px; height: 30px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .brand b { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .brand small { display: block; font-size: 12px; color: var(--ink2); font-weight: 500; }
  .seg { display: flex; background: var(--soft); border-radius: 999px; padding: 3px; }
  .seg span { font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; color: var(--ink2); }
  .seg span.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(37,27,19,.08); }

  .card { background: var(--card); border-radius: 24px; padding: 20px; }
  .label { font-size: 12px; font-weight: 600; color: var(--ink2); letter-spacing: .01em; }
  h2 { font-size: 18px; font-weight: 600; letter-spacing: -.015em; margin-bottom: 4px; }
  .sub { font-size: 13px; color: var(--ink2); line-height: 1.45; }

  .grid { display: grid; gap: 12px; }

  /* Verdict */
  .verdict { display: flex; gap: 14px; align-items: flex-start; }
  .big-dot { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; background: var(--warn-bg); display: grid; place-items: center; }
  .big-dot i { width: 14px; height: 14px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 6px rgba(200,137,42,.15); }
  .verdict h1 { font-size: 24px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; margin-bottom: 6px; }
  .verdict p { font-size: 15px; line-height: 1.45; color: var(--ink2); }
  .verdict p b { color: var(--ink); font-weight: 600; }
  .pill-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 999px; }

  /* Chiffres */
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .kpi { background: var(--card); border-radius: 20px; padding: 14px 14px 16px; }
  .kpi .v { font-size: 22px; font-weight: 600; letter-spacing: -.02em; margin-top: 6px; white-space: nowrap; }
  .kpi .d { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .up { color: var(--ok); } .down { color: var(--bad); } .flat { color: var(--ink2); }

  /* Fonctions */
  .rows { margin-top: 8px; }
  .row { display: grid; grid-template-columns: 12px 1fr auto 64px 12px; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
  .row .n { font-size: 15px; font-weight: 500; }
  .row .n small { display: block; font-size: 12px; color: var(--ink2); font-weight: 400; margin-top: 2px; }
  .row .p { font-size: 15px; font-weight: 600; text-align: right; }
  .row .p small { display: block; font-size: 11px; color: var(--ink3); font-weight: 500; margin-top: 2px; }
  .row.warn-row .p { color: var(--warn); }
  .chev { color: var(--ink3); font-size: 18px; line-height: 1; }
  svg.spark { width: 64px; height: 24px; display: block; }

  .more { display: block; text-align: center; font-size: 14px; font-weight: 600; color: var(--ink2); padding-top: 14px; border-top: 1px solid var(--line); margin-top: 2px; }

  /* Blocs secondaires */
  .mini-rows .r { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .mini-rows .r:first-child { border-top: 0; }
  .mini-rows .r span { color: var(--ink2); }
  .mini-rows .r b { font-weight: 600; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
  .tag.ok { background: var(--ok-bg); color: var(--ok); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }

  .funnel { margin-top: 12px; display: grid; gap: 8px; }
  .fbar { display: grid; grid-template-columns: 92px 1fr 54px; gap: 10px; align-items: center; font-size: 13px; }
  .fbar span { color: var(--ink2); }
  .fbar .track { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .fbar .track i { display: block; height: 100%; border-radius: 999px; background: var(--ink); opacity: .85; }
  .fbar b { text-align: right; font-weight: 600; }

  .foot { text-align: center; font-size: 12px; color: var(--ink3); margin-top: 18px; line-height: 1.5; }

  /* Fiche détail */
  .back { font-size: 15px; font-weight: 600; color: var(--ink2); margin-bottom: 14px; display: inline-block; }
  .detail-head .state { display: inline-flex; align-items: center; gap: 6px; }
  .bigline { font-size: 34px; font-weight: 600; letter-spacing: -.03em; margin-top: 8px; }
  .bigline small { display: block; font-size: 15px; font-weight: 500; color: var(--ink2); letter-spacing: 0; margin-top: 2px; }
  svg.chart { width: 100%; height: 120px; display: block; margin-top: 12px; }
  .bars .b { margin-top: 12px; }
  .bars .b .t { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .bars .b .t span { color: var(--ink2); }
  .bars .b .t b { font-weight: 600; }
  .bars .track { height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; }
  .bars .track i { display: block; height: 100%; background: var(--warn); border-radius: 999px; }
  .note { background: var(--soft); border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.5; color: var(--ink); }
  .note b { font-weight: 600; }
  .replay { display: flex; gap: 10px; margin-top: 12px; }
  .replay div { flex: 1; aspect-ratio: 9/16; max-height: 150px; border-radius: 14px; background: linear-gradient(180deg, #F4F2EF, #E7E3DE); display: grid; place-items: center; font-size: 12px; color: var(--ink3); font-weight: 600; text-align: center; padding: 8px; }

  /* Ordinateur */
  @media (min-width: 900px) {
    .page { padding: 32px 32px 64px; }
    .layout { display: grid; grid-template-columns: 1.15fr 1fr; gap: 16px; align-items: start; }
    .verdict h1 { font-size: 30px; }
    .kpi .v { font-size: 28px; }
    .side { display: grid; gap: 16px; }
  }
  @media (max-width: 899px) {
    .layout, .side { display: grid; gap: 12px; }
  }

  /* ── États propres à la page réelle (absents de la maquette) ── */
  .seg span, .row, .pill-btn, .more, .back { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
  .seg span:focus-visible, .row:focus-visible, .pill-btn:focus-visible, .more:focus-visible, .back:focus-visible { outline: 2px solid var(--ink3); outline-offset: 2px; }
  .row:last-child { padding-bottom: 13px; }
  .big-dot.ok { background: var(--ok-bg); } .big-dot.ok i { background: var(--ok); box-shadow: 0 0 0 6px rgba(63,138,92,.15); }
  .big-dot.bad { background: var(--bad-bg); } .big-dot.bad i { background: var(--bad); box-shadow: 0 0 0 6px rgba(192,71,60,.15); }
  .big-dot.grey { background: var(--soft); } .big-dot.grey i { background: var(--ink3); box-shadow: 0 0 0 6px rgba(37,27,19,.06); }
  .dot.grey { background: rgba(37, 27, 19, .22); }
  .row.bad-row .p { color: var(--bad); }
  .row.grey-row .p { color: var(--ink3); font-size: 13px; font-weight: 500; grid-column: 3 / 5; }
  .row.grey-row .n { color: var(--ink2); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .bars .track i.ok { background: var(--ok); } .bars .track i.bad { background: var(--bad); } .bars .track i.grey { background: var(--ink3); }
  .data-note { font-size: 12px; color: var(--ink2); line-height: 1.45; padding: 0 4px; }
  .msg { max-width: 520px; margin: 24px auto 0; }
  .msg h2 { margin-bottom: 6px; }
  .msg .pill-btn { border: 0; font-family: inherit; }
  .skel { display: block; background: rgba(37, 27, 19, .06); border-radius: 8px; animation: skel 1.4s ease-in-out infinite; }
  @keyframes skel { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
(function () {
  'use strict';

  // ── Réglages ────────────────────────────────────────────────────────────
  var API_URL = 'https://lzzazyqaowaxlfzxqkna.supabase.co/functions/v1/pilotage';
  var KEY_STORE = 'adermio_pilotage_key';
  var PERIOD_STORE = 'adermio_pilotage_period';
  var PERIODS = [['day', 'Hier'], ['7d', '7 j'], ['30d', '30 j']];
  var VISIBLE_FUNCTIONS = 6;
  var NB = ' ';

  // « Voir … » du verdict, et noms au pluriel pour la fiche.
  var VOIR = {
    photo_analysis: "l'analyse photo", payment: 'le paiement', onboarding_verdict: "le verdict de l'onboarding",
    product_scan: 'le scan produit', skin_match: 'le verdict produit', adjust: '« Ajuster ma routine »',
    routine_generation: 'la génération de routine', meal: 'les repas', food_scan: 'le scan aliment',
    bilan_j28: 'le bilan J28', point_repere: 'le Point Repère', auth: 'la connexion', startup: 'le démarrage'
  };
  var REUSSIS = {
    photo_analysis: "d'analyses réussies", payment: 'de paiements débloqués', onboarding_verdict: 'de verdicts affichés',
    product_scan: 'de scans réussis', skin_match: 'de verdicts réussis', adjust: "d'ajustements réussis",
    routine_generation: 'de routines générées', meal: 'de repas enregistrés', food_scan: 'de scans réussis',
    bilan_j28: 'de bilans réussis', point_repere: 'de Points Repère réussis', auth: 'de connexions réussies',
    startup: 'de démarrages réussis'
  };
  var STATE_LABEL = { green: 'Va bien', orange: 'À regarder', red: 'Problème en cours', grey: 'Peu de données' };
  var CLS = { green: 'ok', orange: 'warn', red: 'bad', grey: 'grey' };
  var COLOR = { green: '#3F8A5C', orange: '#C8892A', red: '#C0473C', grey: 'rgba(37,27,19,.40)' };
  var RANK = { red: 0, orange: 1, green: 2, grey: 3 };

  // ── Stockage local (protégé) ─────────────────────────────────────────────
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) {} }

  var params = new URLSearchParams(location.search);
  var mock = params.get('mock');
  var MOCK_FILE = mock === 'vide' ? 'pilotage-mock-vide.json' : (mock ? 'pilotage-mock.json' : null);

  var memKey = null; // repli si localStorage est indisponible
  (function captureKey() {
    var m = /^#k=([^&]+)/.exec(location.hash || '');
    if (!m) return;
    memKey = decodeURIComponent(m[1]);
    lsSet(KEY_STORE, memKey);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  })();
  function getKey() { return lsGet(KEY_STORE) || memKey; }
  function dropKey() { memKey = null; lsDel(KEY_STORE); }

  var state = {
    period: (function () { var p = lsGet(PERIOD_STORE); return (p === 'day' || p === '7d' || p === '30d') ? p : 'day'; })(),
    phase: 'loading', // loading | ok | error | nokey | invalid
    data: null,
    cache: {},
    showAll: false,
    fromHome: false,
    homeScroll: 0
  };
  var app = document.getElementById('app');
  var seq = 0;

  // ── Formats français ─────────────────────────────────────────────────────
  function isNum(n) { return typeof n === 'number' && isFinite(n); }
  function group(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, NB); }
  function int(n) { var r = Math.round(n); return (r < 0 ? '−' : '') + group(String(Math.abs(r))); }
  function dec(n, d) {
    var s = Math.abs(n).toFixed(d).split('.');
    return (n < 0 && Number(s.join('.')) !== 0 ? '−' : '') + group(s[0]) + (s[1] ? ',' + s[1] : '');
  }
  function rate(n) { return isNum(n) ? (n === 100 ? '100' : dec(n, 1)) + NB + '%' : '—'; }
  function pctShort(n) {
    if (!isNum(n)) return '—';
    var r = Math.round(n * 10) / 10;
    return (r === Math.round(r) ? int(r) : dec(r, 1)) + NB + '%';
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function lowerFirst(s) { s = String(s || ''); return s.charAt(0).toLowerCase() + s.slice(1); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  // **gras** permis dans les phrases (note), le reste échappé.
  function richText(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

  function parisTime(iso) {
    var d = new Date(iso); if (isNaN(d)) return '—';
    try { return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' }); }
    catch (e) { return d.toTimeString().slice(0, 5); }
  }
  function headerLine(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    var day;
    try { day = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short', timeZone: 'Europe/Paris' }); }
    catch (e) { day = d.toLocaleDateString('fr-FR'); }
    var min = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
    var ago = min < 1 ? "à l'instant" : min < 60 ? 'il y a ' + min + ' min' : min < 1440 ? 'il y a ' + Math.round(min / 60) + ' h' : 'il y a ' + Math.round(min / 1440) + ' j';
    return cap(day) + ' · ' + ago;
  }

  // ── Courbes ──────────────────────────────────────────────────────────────
  // Échelle : du plus haut au plus bas (valeurs et normale), avec un écart minimal
  // pour qu'une ligne stable reste plate, en haut, comme dans la maquette.
  function scale(values, norm, minSpan) {
    var pts = values.filter(isNum);
    if (isNum(norm)) pts.push(norm);
    var hi = Math.max.apply(null, pts), lo = Math.min.apply(null, pts);
    if (hi - lo < minSpan) lo = hi - minSpan;
    return { lo: lo, hi: hi };
  }
  function segments(values, w, top, bottom, sc) {
    var n = values.length, step = n > 1 ? w / (n - 1) : 0, segs = [], cur = [];
    values.forEach(function (v, i) {
      if (!isNum(v)) { if (cur.length) segs.push(cur); cur = []; return; }
      var y = top + (sc.hi - v) / ((sc.hi - sc.lo) || 1) * (bottom - top);
      cur.push([Math.round(i * step * 10) / 10, Math.round(y * 10) / 10]);
    });
    if (cur.length) segs.push(cur);
    return segs;
  }
  function drawSegs(segs, color, sw) {
    return segs.map(function (s) {
      if (s.length === 1) return '<circle cx="' + s[0][0] + '" cy="' + s[0][1] + '" r="' + (sw * 0.9) + '" fill="' + color + '"/>';
      return '<polyline fill="none" stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round" points="' +
        s.map(function (p) { return p[0] + ',' + p[1]; }).join(' ') + '"/>';
    }).join('');
  }
  function hasPoints(values) { return Array.isArray(values) && values.some(isNum); }
  function sparkSvg(f) {
    if (f.status === 'grey' || !hasPoints(f.spark)) return '<svg class="spark" viewBox="0 0 64 24" aria-hidden="true"></svg>';
    var sc = scale(f.spark, f.norm_pct, 3);
    return '<svg class="spark" viewBox="0 0 64 24" aria-hidden="true">' + drawSegs(segments(f.spark, 64, 4, 19, sc), COLOR[f.status] || COLOR.green, 2) + '</svg>';
  }
  // Index (0-13) du jour AAAA-MM-JJ dans les 14 jours qui finissent à `to` inclus, sinon -1.
  function dayIndex(day, to, n) {
    var re = /^(\d{4})-(\d{2})-(\d{2})$/, a = re.exec(day || ''), b = re.exec(to || '');
    if (!a || !b) return -1;
    var diff = Math.round((Date.UTC(+b[1], b[2] - 1, +b[3]) - Date.UTC(+a[1], a[2] - 1, +a[3])) / 86400000);
    var idx = n - 1 - diff;
    return idx >= 0 && idx <= n - 1 ? idx : -1;
  }
  function chartSvg(f, d) {
    var sc = scale(f.spark, f.norm_pct, 4), top = 24, bottom = 88, out = '';
    out += '<svg class="chart" viewBox="0 0 320 120" preserveAspectRatio="none" aria-hidden="true">';
    if (isNum(f.norm_pct)) {
      var ny = Math.round((top + (sc.hi - f.norm_pct) / ((sc.hi - sc.lo) || 1) * (bottom - top)) * 10) / 10;
      out += '<line x1="0" y1="' + ny + '" x2="320" y2="' + ny + '" stroke="rgba(37,27,19,.12)" stroke-dasharray="4 5"/>';
      out += '<text x="2" y="' + (ny < 14 ? ny + 14 : ny - 6) + '" font-size="10" fill="rgba(37,27,19,.45)" font-family="Inter">normale ' + esc(pctShort(f.norm_pct)) + '</text>';
    }
    out += drawSegs(segments(f.spark, 320, top, bottom, sc), COLOR[f.status] || COLOR.green, 2.5);
    // Ligne « sortie X » au premier jour de la dernière version, si ce jour est dans les 14 affichés.
    var rel = d && d.release;
    var n = f.spark.length;
    var idx = rel && rel.version && n > 1 ? dayIndex(rel.first_seen_day, d.to, n) : -1;
    if (idx >= 0) {
      var x = Math.round(idx * 320 / (n - 1) * 10) / 10;
      var right = x <= 240;
      out += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="120" stroke="rgba(37,27,19,.25)" stroke-width="1"/>';
      out += '<text x="' + (right ? x + 5 : x - 5) + '" y="112" font-size="10" fill="rgba(37,27,19,.55)" font-family="Inter"' +
        (right ? '' : ' text-anchor="end"') + '>sortie ' + esc(rel.version) + '</text>';
    }
    return out + '</svg>';
  }

  // ── Morceaux d'écran ─────────────────────────────────────────────────────
  function topBar(small, withSeg) {
    var seg = '';
    if (withSeg) {
      seg = '<div class="seg" role="tablist">' + PERIODS.map(function (p) {
        return '<span role="tab" tabindex="0" data-period="' + p[0] + '" aria-selected="' + (p[0] === state.period) + '"' +
          (p[0] === state.period ? ' class="on"' : '') + '>' + p[1] + '</span>';
      }).join('') + '</div>';
    }
    return '<div class="top"><div class="brand"><div class="logo">A</div><div><b>Suivi Adermio</b><small>' + esc(small) + '</small></div></div>' + seg + '</div>';
  }

  function messageCard(title, text, retry) {
    return '<div class="card msg"><h2>' + esc(title) + '</h2><div class="sub">' + esc(text) + '</div>' +
      (retry ? '<button class="pill-btn" data-act="retry">Réessayer</button>' : '') + '</div>';
  }

  function skel(w, h, extra) { return '<span class="skel" style="width:' + w + ';height:' + h + 'px' + (extra || '') + '"></span>'; }
  function skeletonHome() {
    var rows = '';
    for (var i = 0; i < 6; i++) {
      rows += '<div class="row" style="cursor:default"><span class="skel" style="width:10px;height:10px;border-radius:50%"></span>' +
        '<div>' + skel('60%', 15) + skel('38%', 11, ';margin-top:6px') + '</div>' +
        '<div>' + skel('48px', 15) + '</div>' + skel('64px', 16) + '<div></div></div>';
    }
    function sideCard(lines) {
      var s = '<div class="card">' + skel('34%', 12) + skel('70%', 20, ';margin-top:10px');
      for (var j = 0; j < lines; j++) s += skel('100%', 14, ';margin-top:16px');
      return s + '</div>';
    }
    return '<div class="layout"><div class="grid">' +
      '<div class="card verdict"><span class="skel" style="width:44px;height:44px;border-radius:50%;flex:0 0 auto"></span><div style="flex:1">' +
      skel('24%', 12) + skel('62%', 26, ';margin-top:8px') + skel('100%', 14, ';margin-top:12px') + skel('80%', 14, ';margin-top:8px') + '</div></div>' +
      '<div class="kpis">' + [0, 1, 2].map(function () { return '<div class="kpi">' + skel('70%', 12) + skel('60%', 22, ';margin-top:8px') + skel('80%', 11, ';margin-top:8px') + '</div>'; }).join('') + '</div>' +
      '<div class="card"><h2>Les fonctions</h2><div class="sub">Part des essais qui ont marché. La moins bonne en premier.</div><div class="rows">' + rows + '</div></div>' +
      '</div><div class="side">' + sideCard(3) + sideCard(4) + sideCard(2) + sideCard(0) + '</div></div>';
  }

  function sortedFunctions(d) {
    var list = Array.isArray(d.functions) ? d.functions.slice() : [];
    return list.map(function (f, i) { return { f: f, i: i }; }).sort(function (a, b) {
      var ra = RANK[a.f.status] != null ? RANK[a.f.status] : 3, rb = RANK[b.f.status] != null ? RANK[b.f.status] : 3;
      if (ra !== rb) return ra - rb;
      if (ra < 3 && isNum(a.f.rate_pct) && isNum(b.f.rate_pct) && a.f.rate_pct !== b.f.rate_pct) return a.f.rate_pct - b.f.rate_pct;
      return a.i - b.i;
    }).map(function (x) { return x.f; });
  }
  function fnByKey(d, key) {
    var list = Array.isArray(d.functions) ? d.functions : [];
    for (var i = 0; i < list.length; i++) if (list[i] && list[i].key === key) return list[i];
    return null;
  }
  function fnName(d, key) { var f = fnByKey(d, key); return f ? f.name : key; }

  function verdictCard(d) {
    var v = d.verdict || { status: 'grey', title: '—', sentence: '', focus: null };
    var cls = CLS[v.status] || 'grey';
    var html = esc(v.sentence || '');
    // Gras comme la maquette : le nom de la fonction en cause, puis le premier pourcentage.
    if (v.focus) {
      var nm = esc(lowerFirst(fnName(d, v.focus)));
      var idx = nm ? html.toLowerCase().indexOf(nm.toLowerCase()) : -1;
      if (idx >= 0) html = html.slice(0, idx) + '<b>' + html.slice(idx, idx + nm.length) + '</b>' + html.slice(idx + nm.length);
    }
    html = html.replace(/(\d+(?:,\d+)?[\s  ]?%)(?![^<]*<\/b>)/, '<b>$1</b>');
    var btn = '';
    if (v.focus) {
      var voir = VOIR[v.focus] || lowerFirst(fnName(d, v.focus));
      btn = '<a class="pill-btn" role="button" tabindex="0" data-fn="' + esc(v.focus) + '">Voir ' + esc(voir) + ' →</a>';
    }
    return '<div class="card verdict"><div class="big-dot ' + cls + '"><i></i></div><div>' +
      '<div class="label">Le verdict</div><h1>' + esc(v.title || '') + '</h1><p>' + html + '</p>' + btn + '</div></div>';
  }

  function vsNorm(delta) {
    if (!isNum(delta)) return '<div class="d flat">pas encore de normale</div>';
    if (Math.abs(delta) < 5) return '<div class="d flat">≈ normale</div>';
    return '<div class="d ' + (delta > 0 ? 'up' : 'down') + '">' + (delta > 0 ? '+' : '−') + int(Math.abs(delta)) + NB + '% vs normale</div>';
  }
  function kpiCards(d) {
    var k = d.kpis || {};
    var empty = '<div class="v">—</div><div class="d flat">pas de données</div>';
    var r = k.revenue, n = k.new_users, p = k.purchases;
    var rev = r && isNum(r.value_eur)
      ? '<div class="v">' + int(r.value_eur) + NB + '€</div>' + vsNorm(isNum(r.delta_pct) ? r.delta_pct : (isNum(r.norm_eur) && r.norm_eur > 0 ? (r.value_eur - r.norm_eur) / r.norm_eur * 100 : null))
      : empty;
    var nw = n && isNum(n.value)
      ? '<div class="v">' + int(n.value) + '</div>' + vsNorm(isNum(n.norm) && n.norm > 0 ? (n.value - n.norm) / n.norm * 100 : null)
      : empty;
    var pu = p && isNum(p.value)
      ? '<div class="v">' + int(p.value) + '</div>' + (isNum(p.rate_pct) ? '<div class="d up">' + dec(p.rate_pct, 1) + NB + '% des nouveaux</div>' : '<div class="d flat">' + NB + '</div>')
      : empty;
    return '<div class="kpis">' +
      '<div class="kpi"><div class="label">Chiffre d\'affaires</div>' + rev + '</div>' +
      '<div class="kpi"><div class="label">Nouveaux</div>' + nw + '</div>' +
      '<div class="kpi"><div class="label">Achats</div>' + pu + '</div></div>';
  }

  function fnRow(f, first) {
    var st = CLS[f.status] ? f.status : 'grey';
    var rowCls = st === 'orange' ? ' warn-row' : st === 'red' ? ' bad-row' : st === 'grey' ? ' grey-row' : '';
    var attempts = isNum(f.attempts) ? int(f.attempts) + (first ? ' essais' : '') : '';
    var p = st === 'grey'
      ? 'peu de données' + (isNum(f.attempts) ? '<small>' + int(f.attempts) + ' essai' + (f.attempts > 1 ? 's' : '') + '</small>' : '')
      : rate(f.rate_pct) + (attempts ? '<small>' + attempts + '</small>' : '');
    return '<div class="row' + rowCls + '" role="button" tabindex="0" data-fn="' + esc(f.key) + '">' +
      '<div class="dot ' + CLS[st] + '"></div>' +
      '<div class="n">' + esc(f.name) + '<small>Normale : ' + pctShort(f.norm_pct) + '</small></div>' +
      '<div class="p">' + p + '</div>' + (st === 'grey' ? '' : sparkSvg(f)) + '<div class="chev">›</div></div>';
  }
  function functionsCard(d) {
    var list = sortedFunctions(d);
    var head = '<div class="card"><h2>Les fonctions</h2><div class="sub">Part des essais qui ont marché. La moins bonne en premier.</div>';
    if (!list.length) return head + '<div class="sub" style="margin-top:12px">Pas encore de données.</div></div>';
    var shown = state.showAll ? list : list.slice(0, VISIBLE_FUNCTIONS);
    var rest = list.slice(VISIBLE_FUNCTIONS);
    var rows = shown.map(function (f, i) { return fnRow(f, i === 0); }).join('');
    var more = '';
    if (rest.length) {
      var allGreen = rest.every(function (f) { return f.status === 'green'; });
      more = state.showAll
        ? '<a class="more" role="button" tabindex="0" data-act="more">Masquer les ' + rest.length + ' autres fonctions</a>'
        : '<a class="more" role="button" tabindex="0" data-act="more">Voir les ' + rest.length + ' autres fonction' + (rest.length > 1 ? 's' : '') +
          (allGreen ? (rest.length > 1 ? ', toutes vertes' : ', verte') : '') + '</a>';
    }
    return head + '<div class="rows">' + rows + '</div>' + more + '</div>';
  }

  var EMPTY_LINE = 'Pas encore de données : arrive avec la version 1.1.14.';
  function emptyCard(label, h2) {
    return '<div class="card"><div class="label">' + esc(label) + '</div>' + (h2 ? '<h2 style="margin-top:6px">' + esc(h2) + '</h2>' : '') +
      '<div class="sub"' + (h2 ? '' : ' style="margin-top:6px"') + '>' + EMPTY_LINE + '</div></div>';
  }

  function samePeriod() {
    return state.period === 'day' ? 'sur la même journée' : state.period === '7d' ? 'sur les mêmes 7 jours' : 'sur les mêmes 30 jours';
  }
  function releaseCard(d) {
    var r = d.release;
    if (!r || !r.version) return emptyCard('Dernière version');
    var degr = Array.isArray(r.degrading) ? r.degrading : [];
    var degrTag = degr.length
      ? '<span class="tag warn">' + degr.length + ' · ' + esc(degr.map(function (k) { return lowerFirst(fnName(d, k)); }).join(', ')) + '</span>'
      : '<span class="tag ok">aucune</span>';
    var stalls = isNum(r.stalled_screens)
      ? (r.stalled_screens > 0 ? '<span class="tag warn">' + int(r.stalled_screens) + '</span>' : '<span class="tag ok">aucun</span>')
      : '—';
    var crash = '—';
    if (isNum(r.crash_free_users_pct)) {
      var c = Math.max(0, 100 - r.crash_free_users_pct);
      var normal = c <= 0.5;
      crash = dec(c, 2) + NB + '% <span style="color:' + (normal ? 'var(--ink3)' : 'var(--warn)') + ';font-weight:500">(' + (normal ? 'normal' : 'élevé') + ')</span>';
    }
    var h2 = esc(r.version) + (isNum(r.adoption_pct) ? ' · installée par ' + int(r.adoption_pct) + NB + '%' : '');
    var sub = r.previous ? 'Comparée à la ' + esc(r.previous) + ', ' + samePeriod() + '.' : 'Pas de version précédente à comparer.';
    return '<div class="card"><div class="label">Dernière version</div><h2 style="margin-top:6px">' + h2 + '</h2>' +
      '<div class="sub">' + sub + '</div><div class="mini-rows" style="margin-top:8px">' +
      '<div class="r"><span>Fonctions qui se dégradent</span><b>' + degrTag + '</b></div>' +
      '<div class="r"><span>Écrans bloqués</span><b>' + stalls + '</b></div>' +
      '<div class="r"><span>Plantages</span><b>' + crash + '</b></div></div></div>';
  }

  function moneyCard(d) {
    var m = d.money || {};
    var funnel = Array.isArray(m.funnel) && m.funnel.length ? m.funnel : null;
    var body;
    if (funnel) {
      var top = isNum(funnel[0].value) && funnel[0].value > 0 ? funnel[0].value : 0;
      body = '<div class="funnel">' + funnel.map(function (s) {
        var w = top && isNum(s.value) ? Math.max(0, Math.min(100, Math.round(s.value / top * 100))) : 0;
        return '<div class="fbar"><span>' + esc(s.label) + '</span><div class="track"><i style="width:' + w + '%"></i></div><b>' + (isNum(s.value) ? int(s.value) : '—') + '</b></div>';
      }).join('') + '</div>';
    } else {
      body = '<div class="sub">' + EMPTY_LINE + '</div>';
    }
    var pnu = isNum(m.paid_not_unlocked)
      ? '<span class="tag ' + (m.paid_not_unlocked > 0 ? 'bad' : 'ok') + '">' + int(m.paid_not_unlocked) + '</span>' : '—';
    var mis = isNum(m.entitlement_mismatches) ? int(m.entitlement_mismatches) : '—';
    var anon = isNum(m.anonymous_unlinked) ? int(m.anonymous_unlinked) : '—';
    return '<div class="card"><div class="label">L\'argent</div><h2 style="margin-top:6px">Du nouveau à l\'achat</h2>' + body +
      '<div class="mini-rows" style="margin-top:10px">' +
      '<div class="r"><span>Payés mais pas débloqués</span><b>' + pnu + '</b></div>' +
      '<div class="r"><span>Écarts Apple / serveur</span><b>' + mis + '</b></div>' +
      '<div class="r"><span>Achats anonymes pas encore reliés</span><b>' + anon + '</b></div></div></div>';
  }

  function screensCard(d) {
    if (!Array.isArray(d.screens)) return emptyCard('Écrans bloqués', 'Chargements de plus de 15 s');
    var list = d.screens.filter(function (s) { return s && isNum(s.stalls) && s.stalls > 0; })
      .sort(function (a, b) { return b.stalls - a.stalls; });
    var rows = list.map(function (s) {
      var n = s.stalls >= 5 ? '<span class="tag warn">' + int(s.stalls) + '</span>' : int(s.stalls);
      return '<div class="r"><span>' + esc(s.label || s.screen_name) + '</span><b>' + n + '</b></div>';
    }).join('');
    rows += '<div class="r"><span>' + (list.length ? 'Tous les autres écrans' : 'Tous les écrans') + '</span><b>0</b></div>';
    return '<div class="card"><div class="label">Écrans bloqués</div><h2 style="margin-top:6px">Chargements de plus de 15 s</h2>' +
      '<div class="mini-rows" style="margin-top:8px">' + rows + '</div></div>';
  }

  function protectedCard(d) {
    var p = d.protected;
    var label = 'Traitements, sécurité, journal des effets';
    if (!p || !isNum(p.success_pct)) return emptyCard(label);
    return '<div class="card"><div class="label">' + label + '</div><h2 style="margin-top:6px">' + rate(p.success_pct) + ' de réussite</h2>' +
      '<div class="sub">Compteurs anonymes : on voit les pannes, jamais une personne.</div></div>';
  }

  function homeView(d) {
    return topBar(headerLine(d.built_at), true) +
      '<div class="layout"><div class="grid">' + verdictCard(d) + kpiCards(d) +
      (d.data_note ? '<div class="data-note">' + esc(d.data_note) + '</div>' : '') +
      functionsCard(d) + '</div><div class="side">' + releaseCard(d) + moneyCard(d) + screensCard(d) + protectedCard(d) + '</div></div>' +
      '<div class="foot">Mis à jour à ' + parisTime(d.built_at) + ' · mêmes sources que l\'e-mail de 9 h</div>';
  }

  function detailView(d, f) {
    var st = CLS[f.status] ? f.status : 'grey';
    var big;
    if (st === 'grey' || !isNum(f.rate_pct)) {
      big = '<div class="bigline">Peu de données<small>' + (isNum(f.attempts) ? int(f.attempts) + ' essai' + (f.attempts > 1 ? 's' : '') + ' sur la période, il en faut 20.' : 'Aucun essai sur la période.') + '</small></div>';
    } else {
      big = '<div class="bigline">' + rate(f.rate_pct) + ' <small>' + esc(REUSSIS[f.key] || "d'essais réussis") +
        (isNum(f.norm_pct) ? ', contre ' + pctShort(f.norm_pct) + ' d\'habitude' : '') + '</small></div>';
    }
    var chart = hasPoints(f.spark)
      ? chartSvg(f, d) + '<div class="sub" style="margin-top:6px">14 derniers jours</div>'
      : '<div class="sub" style="margin-top:12px">Pas assez d\'essais pour tracer la courbe des 14 derniers jours.</div>';
    var det = f.detail || {};
    var note = det.note ? '<div class="card"><h2>Ce que j\'en comprends</h2><div class="note" style="margin-top:10px">' + richText(det.note) + '</div></div>' : '';
    var groups = [['by_step', 'Étape'], ['by_error', 'Erreur'], ['by_lang', 'Langue'], ['by_version', 'Version']];
    var bars = '';
    groups.forEach(function (g) {
      (Array.isArray(det[g[0]]) ? det[g[0]] : []).forEach(function (x) {
        if (!x) return;
        var w = isNum(x.share_pct) ? Math.max(0, Math.min(100, Math.round(x.share_pct))) : 0;
        bars += '<div class="b"><div class="t"><span>' + g[1] + ' : ' + esc(x.label) + '</span><b>' + (isNum(x.share_pct) ? int(x.share_pct) + NB + '%' : '—') + '</b></div>' +
          '<div class="track"><i class="' + (st === 'orange' ? '' : CLS[st]) + '" style="width:' + w + '%"></i></div></div>';
      });
    });
    if (!bars) {
      bars = '<div class="sub">' + (isNum(f.failures) && f.failures === 0 ? 'Aucun échec sur la période.' : 'Pas encore de détail sur les échecs.') + '</div>';
    }
    return '<a class="back" role="button" tabindex="0" data-act="back">‹ Suivi</a>' +
      '<div class="layout"><div class="grid">' +
      '<div class="card detail-head"><div class="state"><div class="dot ' + CLS[st] + '"></div><span class="label">' + STATE_LABEL[st] + '</span></div>' +
      '<h1 style="font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:8px">' + esc(f.name) + '</h1>' + big + chart + '</div>' +
      note + '</div><div class="side">' +
      '<div class="card bars"><h2>Où ça casse</h2>' + bars + '</div>' +
      '<div class="card"><h2>Les replays</h2><div class="sub">Trois sessions en échec, choisies pour vous. Tout est masqué.</div>' +
      '<div class="replay"><div>Replay 1</div><div>Replay 2</div><div>Replay 3</div></div>' +
      '<div class="sub" style="margin-top:10px">Arrive avec le lot replay (prochain build).</div></div>' +
      '</div></div>';
  }

  // ── Navigation ───────────────────────────────────────────────────────────
  function currentFn() {
    var m = /^#f=(.+)$/.exec(location.hash || '');
    return m ? decodeURIComponent(m[1]) : null;
  }
  function render() {
    var key = currentFn();
    if (state.phase === 'nokey') { app.innerHTML = topBar('Accès privé', false) + messageCard("Lien d'accès requis", 'Demandez le lien à Claude.'); return; }
    if (state.phase === 'invalid') { app.innerHTML = topBar('Accès privé', false) + messageCard("Lien d'accès invalide", 'Demandez un nouveau lien à Claude.'); return; }
    if (state.phase === 'error') { app.innerHTML = topBar('Chargement interrompu', true) + messageCard('Chargement impossible', 'Les données ne sont pas arrivées. Vérifiez la connexion, puis réessayez.', true); return; }
    if (state.phase === 'loading' || !state.data) { app.innerHTML = topBar('Chargement…', true) + skeletonHome(); return; }
    var f = key ? fnByKey(state.data, key) : null;
    if (key && !f) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    if (f) { app.innerHTML = detailView(state.data, f); window.scrollTo(0, 0); return; }
    app.innerHTML = homeView(state.data);
    if (state.homeScroll) { window.scrollTo(0, state.homeScroll); state.homeScroll = 0; }
  }

  function openFn(key) {
    state.homeScroll = window.scrollY || 0;
    state.fromHome = true;
    location.hash = 'f=' + encodeURIComponent(key);
  }
  function goHome() {
    if (state.fromHome) { state.fromHome = false; history.back(); return; }
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    render();
  }
  window.addEventListener('hashchange', function () {
    if (!currentFn()) state.fromHome = false;
    render();
  });

  function onActivate(t) {
    var el = t.closest('[data-period],[data-fn],[data-act]');
    if (!el) return;
    if (el.hasAttribute('data-period')) {
      var p = el.getAttribute('data-period');
      if (p === state.period && state.phase === 'ok') return;
      state.period = p; lsSet(PERIOD_STORE, p); load();
    } else if (el.hasAttribute('data-fn')) {
      openFn(el.getAttribute('data-fn'));
    } else {
      var a = el.getAttribute('data-act');
      if (a === 'more') { state.showAll = !state.showAll; render(); }
      else if (a === 'back') goHome();
      else if (a === 'retry') load(true);
    }
  }
  app.addEventListener('click', function (e) { onActivate(e.target); });
  app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('[role="button"],[role="tab"]')) { e.preventDefault(); onActivate(e.target); }
  });

  // ── Données ──────────────────────────────────────────────────────────────
  function load(force) {
    var my = ++seq;
    var period = state.period;
    var key = getKey();
    if (!MOCK_FILE && !key) { state.phase = 'nokey'; render(); return; }
    if (!force && state.cache[period]) { state.data = state.cache[period]; state.phase = 'ok'; render(); return; }
    state.phase = 'loading'; state.data = null; render();
    var req = MOCK_FILE
      ? fetch(MOCK_FILE, { cache: 'no-store' })
      : fetch(API_URL + '?period=' + encodeURIComponent(period), { headers: { 'x-pilotage-key': key }, cache: 'no-store' });
    req.then(function (res) {
      if (my !== seq) return;
      if (!MOCK_FILE && (res.status === 401 || res.status === 403)) { dropKey(); state.phase = 'invalid'; render(); return; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json().then(function (data) {
        if (my !== seq) return;
        if (!data || typeof data !== 'object') throw new Error('réponse vide');
        state.cache[period] = data; state.data = data; state.phase = 'ok'; render();
      });
    }).catch(function () {
      if (my !== seq) return;
      state.phase = 'error'; render();
    });
  }

  load();
})();
</script>
</body>
</html>
